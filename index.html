<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap');
:root{--ink:#253452;--muted:#75809b;--paper:#fff8e8;--white:#fff;--blue:#658bff;--pink:#ff8db2;--yellow:#ffd66e;--green:#68cda5;--purple:#aa91ff;--line:#edf0f7;--shadow:0 16px 48px #30416412}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit}#app{min-height:100vh}.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;max-width:1270px;margin:auto;padding:0 26px}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);font-family:'Baloo 2';font-size:21px;font-weight:800}.brand-icon{height:42px;width:42px;border-radius:15px;background:#fff;display:grid;place-items:center;font-size:24px;box-shadow:var(--shadow)}.top-actions{display:flex;gap:10px;align-items:center}.pill{background:white;border:1px solid #f1ecdF;border-radius:50px;padding:10px 15px;font-weight:800;font-size:13px}.shell{max-width:1270px;margin:14px auto 40px;padding:0 26px;display:grid;grid-template-columns:258px minmax(0,1fr);gap:24px}.sidebar{display:flex;flex-direction:column;gap:14px}.side-card,.card{background:#fff;border-radius:24px;box-shadow:var(--shadow)}.profile{padding:20px}.profile-top{display:flex;align-items:center;gap:13px}.avatar-mini{height:54px;width:54px;border-radius:20px;background:#e7edff;display:grid;place-items:center;font-size:35px}.profile-name{font-family:'Baloo 2';font-size:19px;font-weight:800}.small{color:var(--muted);font-size:12px;font-weight:700}.level-label{display:flex;justify-content:space-between;margin-top:20px;font-size:12px;font-weight:900}.progress{height:9px;background:#f0f2f7;border-radius:9px;overflow:hidden;margin-top:8px}.progress i{display:block;width:22%;height:100%;background:linear-gradient(90deg,#79cfa9,#6ea3ff);border-radius:9px}.side-title{padding:6px 12px 0;color:#9aa3b5;text-transform:uppercase;font-size:10px;letter-spacing:1.5px;font-weight:900}.nav{padding:7px;display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:left;padding:12px 13px;border-radius:14px;font-weight:800;color:#65718a;display:flex;gap:11px;align-items:center}.nav button.active{background:#f0f3ff;color:#516fda}.nav button:hover{background:#f7f8fb}.side-note{padding:17px;background:#e9f8ef;border-radius:20px;font-size:12px;line-height:1.55;font-weight:700;color:#537966}.content{min-width:0}.hero{position:relative;overflow:hidden;background:#cddaff;border-radius:28px;min-height:254px;padding:32px 37px;display:flex;align-items:center;justify-content:space-between}.hero:before{content:'';position:absolute;width:280px;height:280px;right:74px;top:-140px;border-radius:50%;background:#ffffff3a}.hero-copy{position:relative;z-index:1;max-width:460px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:1px;color:#526fca}.hero h1{font-family:'Baloo 2';font-size:40px;line-height:1.05;max-width:440px;margin:10px 0;color:#263c6a}.hero p{margin:0 0 18px;color:#586987;font-weight:700;font-size:14px}.primary{border:0;border-radius:14px;padding:13px 19px;background:#536fe0;color:#fff;font-weight:900;box-shadow:0 6px 0 #3d56bc;transition:transform .15s}.primary:active{transform:translateY(3px);box-shadow:0 3px 0 #3d56bc}.hero-art{position:relative;z-index:1;font-size:112px;margin-right:46px;filter:drop-shadow(0 14px 10px #41547924);animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-9px)}}.section-heading{display:flex;justify-content:space-between;align-items:end;margin:27px 2px 13px}.section-heading h2{margin:0;font-family:'Baloo 2';font-size:23px}.section-heading p{margin:2px 0 0;color:var(--muted);font-weight:700;font-size:12px}.link-button{border:0;background:transparent;color:#667fe1;font-size:12px;font-weight:900}.topics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.topic{padding:15px;border-radius:19px;border:1px solid #f0f1f5;background:#fff;text-align:left;transition:.2s;box-shadow:0 7px 24px #30416408}.topic:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.topic .emoji{width:45px;height:45px;display:grid;place-items:center;border-radius:14px;font-size:25px;margin-bottom:12px}.topic strong{display:block;font-family:'Baloo 2';font-size:16px}.topic span:last-child{font-size:11px;color:var(--muted);font-weight:800}.learn-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:15px}.custom-card{padding:21px;background:#fff;border-radius:22px;box-shadow:var(--shadow)}.custom-title{font-family:'Baloo 2';font-size:19px;margin:0}.custom-sub{font-size:12px;color:var(--muted);font-weight:700;margin:2px 0 15px}.custom-form{display:flex;gap:8px}.custom-form input{min-width:0;flex:1;border:1.5px solid #e9edf5;border-radius:13px;padding:12px 13px;outline:none;font-weight:700}.custom-form input:focus{border-color:#8198ff}.custom-form button{border:0;border-radius:13px;background:#ff9abb;padding:0 16px;color:#fff;font-weight:900;white-space:nowrap}.mini-card{background:#fff1c8;border-radius:22px;padding:18px;display:flex;gap:12px;align-items:center}.mini-card .sun{font-size:35px}.mini-card strong{font-family:'Baloo 2';font-size:17px}.mini-card p{margin:2px 0 0;font-size:11px;color:#806b37;font-weight:700;line-height:1.4}.journey{margin-top:18px;background:#fff;border-radius:23px;padding:19px 21px;box-shadow:var(--shadow);display:flex;gap:18px;align-items:center}.journey-avatar{height:75px;width:75px;background:#ffe4ed;border-radius:23px;display:grid;place-items:center;font-size:48px;flex:none}.journey-main{flex:1}.journey-main h3{font-family:'Baloo 2';margin:0;font-size:19px}.journey-main p{margin:0;color:var(--muted);font-weight:700;font-size:12px}.age-track{display:flex;gap:5px;margin-top:12px}.age-track i{height:7px;flex:1;border-radius:9px;background:#edf0f5}.age-track i.done{background:linear-gradient(90deg,#ffb7c9,#a58cff)}.age-number{font-family:'Baloo 2';font-size:22px;color:#7080df}.activity-screen{max-width:790px;margin:35px auto;padding:0 24px}.back{border:0;background:transparent;color:#65718a;font-weight:900;padding:8px 0;margin-bottom:12px}.activity-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.activity-top h2{font-family:'Baloo 2';font-size:20px;margin:0}.activity-card{background:white;border-radius:27px;padding:32px;box-shadow:var(--shadow)}.activity-tag{display:inline-block;border-radius:30px;padding:7px 12px;background:#eef2ff;color:#617adf;font-size:11px;font-weight:900}.activity-card h1{font-family:'Baloo 2';font-size:31px;margin:14px 0 6px;line-height:1.2}.activity-card .instruction{color:#71809a;font-weight:700;margin:0 0 24px}.question{background:#fff8e8;border-radius:18px;padding:20px;font-family:'Baloo 2';font-size:22px;font-weight:700;line-height:1.35;margin:15px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{background:white;border:2px solid #edf0f6;border-radius:14px;text-align:left;padding:13px 15px;font-weight:800;transition:.15s}.answer:hover{border-color:#aab8ff;background:#f8f9ff}.answer.selected{border-color:#6986ff;background:#eff2ff}.answer.correct{border-color:#56c392;background:#e8f8f0}.answer.wrong{border-color:#ff8eaa;background:#fff0f3}.check-row{display:flex;align-items:center;gap:14px;margin-top:20px}.feedback{font-size:13px;font-weight:900}.success{color:#36956d}.error{color:#dd6178}.activity-footer{display:flex;justify-content:space-between;align-items:center;margin-top:25px;padding-top:17px;border-top:1px solid var(--line);font-size:12px;font-weight:800;color:#8993a8}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);background:#263452;color:white;padding:12px 18px;border-radius:14px;font-weight:800;font-size:13px;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-bg{position:fixed;inset:0;background:#1f2d4855;display:grid;place-items:center;padding:20px;z-index:10}.modal{background:white;border-radius:25px;padding:28px;max-width:430px;width:100%;box-shadow:0 25px 70px #14213b30}.modal h2{font-family:'Baloo 2';margin:0 0 5px}.modal p{color:var(--muted);font-size:13px;font-weight:700}.modal label{font-size:12px;font-weight:900;display:block;margin:16px 0 6px}.modal input,.modal select{width:100%;border:1.5px solid #e9edf5;border-radius:12px;padding:12px;outline:0}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.secondary{border:0;background:#f1f3f8;padding:12px 17px;border-radius:13px;font-weight:900}.empty{text-align:center;background:white;border-radius:21px;padding:28px;color:var(--muted);font-weight:700;grid-column:1/-1}.confetti{font-size:36px;animation:pop .4s}@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}@media(max-width:900px){.shell{grid-template-columns:210px 1fr;gap:15px}.hero-art{margin-right:0;font-size:90px}.topics{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.topbar{padding:0 16px;height:65px}.brand{font-size:17px}.brand-icon{height:37px;width:37px}.pill{font-size:11px;padding:8px 10px}.shell{display:block;margin-top:5px;padding:0 15px}.sidebar{display:none}.hero{min-height:230px;padding:24px}.hero h1{font-size:32px}.hero p{font-size:12px}.hero-art{font-size:75px;position:absolute;right:14px;bottom:10px;opacity:.8}.hero-copy{max-width:80%}.section-heading{margin-top:22px}.topics{gap:9px}.topic{padding:12px}.learn-grid{grid-template-columns:1fr}.journey{padding:14px;gap:12px}.journey-avatar{height:60px;width:60px;font-size:38px}.age-number{font-size:18px}.activity-screen{padding:0 15px;margin-top:18px}.activity-card{padding:21px}.activity-card h1{font-size:26px}.question{font-size:19px;padding:16px}.answers{grid-template-columns:1fr}.activity-footer{gap:8px;font-size:10px}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div>
<script>
const topics=[{id:'ciencias',name:'Ciências',emoji:'🔬',hint:'Descubra como o mundo funciona',color:'#e5f7ef',desc:'Pequenos cientistas',activities:[{q:'O que as plantas precisam para crescer?',a:['Luz do sol, água e ar','Só chocolate','Areia e brinquedos','Escuro e vento'],ok:0,tip:'A luz ajuda a planta a produzir seu alimento, e a água e o ar também são essenciais!'},{q:'Qual destes animais é um mamífero?',a:['Sapo','Baleia','Galinha','Borboleta'],ok:1,tip:'Baleias vivem na água, mas são mamíferos: respiram ar e alimentam seus filhotes com leite.'},{q:'Quando a água vira gelo, o que aconteceu?',a:['Evaporação','Congelamento','Derretimento','Mistura'],ok:1,tip:'Com o frio, a água congela e vira gelo. Quando esquenta, o gelo derrete!'}]}, {id:'matematica',name:'Matemática',emoji:'🔢',hint:'Números, padrões e desafios',color:'#fff0d4',desc:'Mestres dos números',activities:[{q:'Você tem 3 maçãs e ganha mais 4. Quantas maçãs tem?',a:['6','7','8','5'],ok:1,tip:'3 + 4 = 7. Você pode contar nos dedos ou desenhar as maçãs!'},{q:'Qual número vem depois de 25?',a:['24','26','35','15'],ok:1,tip:'Depois do 25 vem o 26. Os números seguem uma ordem!'},{q:'Uma pizza foi dividida em 4 pedaços iguais. Você comeu 1. Que fração comeu?',a:['Um quarto (1/4)','Metade (1/2)','Um inteiro','Três quartos (3/4)'],ok:0,tip:'Um de quatro pedaços iguais é um quarto, escrito 1/4.'}]},{id:'portugues',name:'Português',emoji:'📚',hint:'Palavras, histórias e imaginação',color:'#f1eaff',desc:'Aventureiros das palavras',activities:[{q:'Qual palavra é um verbo?',a:['Azul','Correr','Mesa','Feliz'],ok:1,tip:'Verbos indicam ações. Correr é algo que podemos fazer!'},{q:'Qual é o contrário de “quente”?',a:['Morno','Frio','Grande','Lento'],ok:1,tip:'Frio é o antônimo, ou seja, o contrário de quente.'},{q:'Na frase “O gato dormiu”, quem praticou a ação?',a:['Dormiu','O gato','A cama','Ninguém'],ok:1,tip:'O gato é quem fez a ação de dormir. Ele é o sujeito da frase.'}]},{id:'geografia',name:'Geografia',emoji:'🌍',hint:'Explore lugares e culturas',color:'#e5f1ff',desc:'Exploradores do planeta',activities:[{q:'Em qual planeta nós moramos?',a:['Marte','Vênus','Terra','Júpiter'],ok:2,tip:'Nosso planeta é a Terra, cheio de oceanos, continentes e vida!'},{q:'Qual destes é um oceano?',a:['Saara','Amazonas','Atlântico','Himalaia'],ok:2,tip:'O Oceano Atlântico é uma grande massa de água salgada.'},{q:'O Sol nasce em qual direção?',a:['Norte','Sul','Leste','Oeste'],ok:2,tip:'O Sol aparece no leste pela manhã e se põe no oeste ao entardecer.'}]},{id:'arte',name:'Arte & Música',emoji:'🎨',hint:'Crie, invente e se expresse',color:'#ffe8ed',desc:'Artistas em ação',activities:[{q:'Quais cores misturamos para fazer verde?',a:['Azul e amarelo','Vermelho e azul','Amarelo e vermelho','Preto e branco'],ok:0,tip:'Azul e amarelo são cores primárias que se misturam para formar verde!'},{q:'Quantas cordas tem um violão comum?',a:['4','5','6','8'],ok:2,tip:'Um violão comum tem seis cordas, cada uma pode criar notas diferentes.'},{q:'Qual instrumento tem teclas brancas e pretas?',a:['Tambor','Piano','Flauta','Violino'],ok:1,tip:'O piano tem teclas que produzem sons graves e agudos.'}]},{id:'natureza',name:'Natureza',emoji:'🌱',hint:'Cuide do planeta e dos animais',color:'#e7f6db',desc:'Guardiões da natureza',activities:[{q:'Qual atitude ajuda a economizar água?',a:['Deixar a torneira aberta','Tomar banhos bem longos','Fechar a torneira ao escovar os dentes','Lavar a calçada com mangueira'],ok:2,tip:'Fechar a torneira enquanto escovamos os dentes economiza muitos litros de água.'},{q:'O que devemos fazer com papel usado?',a:['Jogar no rio','Reciclar','Queimar sempre','Enterrar no jardim'],ok:1,tip:'Papel limpo pode ser reciclado e transformado em papel novo!'},{q:'De que as abelhas ajudam as flores?',a:['A dormir','A polinizar','A mudar de cor','A crescer no escuro'],ok:1,tip:'Ao visitar flores, as abelhas transportam pólen e ajudam plantas a formar frutos.'}]}];
const stages=['🧒','🧑','🧑‍🎓','🧑‍💼','🧑‍🦳'];let state={name:'Aventureiro',grade:'4º ano',age:8,done:0,completed:[],screen:'home',topic:null,activity:0,selected:null,feedback:'',earned:false};
try{const saved=JSON.parse(localStorage.getItem('pequenos-saberes'));if(saved)state={...state,...saved,screen:'home',selected:null,feedback:'',earned:false}}catch(e){}
function save(){localStorage.setItem('pequenos-saberes',JSON.stringify({...state,screen:'home',selected:null,feedback:'',earned:false}))}function stage(){return stages[Math.min(4,Math.floor(state.done/5))]}function age(){return state.age+state.done}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const root=document.getElementById('app');root.innerHTML=state.screen==='activity'?activityView():homeView();if(state.modal)modalView()}
function homeView(){const pct=Math.min(100,(state.done%5)*20);return `<header class="topbar"><a class="brand" href="#" onclick="return false"><span class="brand-icon">🌈</span> pequenos grandes saberes</a><div class="top-actions"><span class="pill">⭐ ${state.done} ${state.done===1?'atividade':'atividades'}</span><button class="pill" onclick="openProfile()">⚙️ Perfil</button></div></header><div class="shell"><aside class="sidebar"><div class="side-card profile"><div class="profile-top"><div class="avatar-mini">${stage()}</div><div><div class="profile-name">${esc(state.name)}</div><div class="small">${esc(state.grade)} · ${age()} anos</div></div></div><div class="level-label"><span>Próxima fase</span><span>${state.done%5}/5</span></div><div class="progress"><i style="width:${pct}%"></i></div></div><div class="side-title">Sua jornada</div><div class="side-card nav"><button class="active">🏠 &nbsp; Início</button><button onclick="document.getElementById('themes').scrollIntoView({behavior:'smooth'})">🧩 &nbsp; Temas</button><button onclick="showHistory()">🏅 &nbsp; Conquistas</button></div><div class="side-note">💡 <b>Sabia?</b> Cada desafio concluído faz ${esc(state.name)} crescer um ano. Continue aprendendo!</div></aside><main class="content"><section class="hero"><div class="hero-copy"><span class="eyebrow">UM MUNDO DE DESCOBERTAS ✨</span><h1>Aprender é uma grande aventura!</h1><p>Escolha um tema, resolva desafios e cresça a cada nova descoberta.</p><button class="primary" onclick="startRandom()">Bora aprender! <span>→</span></button></div><div class="hero-art">${stage()}</div></section><div class="section-heading" id="themes"><div><h2>O que vamos explorar?</h2><p>Escolha uma trilha para começar sua aventura</p></div><button class="link-button" onclick="showAll()">Ver todas ↗</button></div><section class="topics">${topics.map(t=>`<button class="topic" onclick="startTopic('${t.id}')"><span class="emoji" style="background:${t.color}">${t.emoji}</span><strong>${t.name}</strong><span>${t.hint}</span></button>`).join('')}</section><div class="section-heading"><div><h2>Curiosidade sem limites</h2><p>Tem algo especial que quer descobrir?</p></div></div><section class="learn-grid"><div class="custom-card"><h3 class="custom-title">✨ Quero aprender sobre...</h3><p class="custom-sub">Escreva um assunto e vamos começar uma missão!</p><form class="custom-form" onsubmit="customTopic(event)"><input id="custom-input" maxlength="80" placeholder="Ex.: dinossauros, espaço, futebol..." required><button>Explorar →</button></form></div><div class="mini-card"><span class="sun">☀️</span><div><strong>Uma dica por dia</strong><p>Perguntar, imaginar e experimentar são jeitos incríveis de aprender.</p></div></div></section><section class="journey"><div class="journey-avatar">${stage()}</div><div class="journey-main"><h3>A jornada de ${esc(state.name)}</h3><p>Criança curiosa hoje, que adulto incrível amanhã!</p><div class="age-track">${Array.from({length:10},(_,i)=>`<i class="${i<state.done?'done':''}"></i>`).join('')}</div></div><div class="age-number">${age()} <span style="font-size:11px">anos</span></div></section></main></div>`}
function activityView(){const t=state.topic,ac=state.activityObj||t.activities[state.activity%t.activities.length],custom=state.customName;return `<header class="topbar"><a class="brand" href="#" onclick="return false"><span class="brand-icon">🌈</span> pequenos grandes saberes</a><div class="top-actions"><span class="pill">⭐ ${state.done} atividades</span></div></header><main class="activity-screen"><button class="back" onclick="goHome()">← Voltar à aventura</button><div class="activity-top"><h2>${t.emoji} ${esc(custom||t.name)}</h2><span class="small">${esc(state.grade)} · missão ${state.activity+1}</span></div><div class="progress" style="margin-bottom:15px"><i style="width:${state.earned?100:20}%"></i></div><section class="activity-card"><span class="activity-tag">${custom?'MISSÃO ESPECIAL':'DESAFIO DE APRENDIZAGEM'} ✨</span><h1>${custom?'Uma pergunta para começar':'Vamos pensar juntos?'}</h1><p class="instruction">${custom?'Escolha a melhor resposta e descubra uma curiosidade!':'Leia com atenção. Você consegue!'}</p><div class="question">${esc(ac.q)}</div><div class="answers">${ac.a.map((a,i)=>`<button class="answer ${state.selected===i?(i===ac.ok?'correct':'wrong'):''}" onclick="selectAnswer(${i})" ${state.earned?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}</div><div class="check-row">${!state.earned?`<button class="primary" onclick="checkAnswer()">Conferir resposta ✓</button>`:`<button class="primary" onclick="nextActivity()">${state.done%5===0?'Continuar crescendo!':'Próximo desafio →'}</button>`}<span class="feedback ${state.feedback?'success':''}">${state.feedback?esc(state.feedback):''}</span></div><div class="activity-footer"><span>🧠 Errar faz parte de aprender!</span><span>🌟 Você consegue</span></div></section></main>`}
function selectAnswer(i){if(state.earned)return;state.selected=i;render()}function checkAnswer(){if(state.selected===null){toast('Escolha uma resposta primeiro!');return}const ac=state.activityObj||state.topic.activities[state.activity%state.topic.activities.length];if(state.selected!==ac.ok){state.feedback='Quase! Tente outra vez 😊';render();return}state.earned=true;state.done++;state.completed.push({topic:state.customName||state.topic.name,date:new Date().toLocaleDateString('pt-BR')});state.feedback='Isso mesmo! '+ac.tip;save();render()}function nextActivity(){if(state.done%5===0){toast(`🎉 ${state.name} cresceu! Agora tem ${age()} anos!`)}state.activity++;state.selected=null;state.feedback='';state.earned=false;state.activityObj=null;save();render()}function goHome(){state.screen='home';state.earned=false;state.activityObj=null;state.selected=null;save();render()}function startTopic(id){state.topic=topics.find(t=>t.id===id);state.customName='';state.activity=0;state.screen='activity';state.selected=null;state.feedback='';state.earned=false;render()}function startRandom(){const t=topics[Math.floor(Math.random()*topics.length)];startTopic(t.id)}function customTopic(e){e.preventDefault();const name=document.getElementById('custom-input').value.trim();if(!name)return;state.customName=name;state.topic={id:'custom',name,emoji:'🔎',activities:[]};state.activity=0;state.screen='activity';state.selected=null;state.earned=false;state.feedback='';const key=name.toLowerCase();const match=topics.flatMap(t=>t.activities.map(a=>({...a,topic:t.name}))).find(a=>key.split(/\s+/).some(w=>w.length>3&&(a.q.toLowerCase().includes(w)||a.a.some(x=>x.toLowerCase().includes(w)))));state.activityObj=match?{...match,q:`${match.q} (tema: ${name})`}:{q:`Qual é uma boa maneira de aprender mais sobre ${name}?`,a:['Fazer perguntas, observar e buscar fontes confiáveis','Acreditar em qualquer coisa sem conferir','Nunca conversar sobre o assunto','Desistir quando aparece uma dúvida'],ok:0,tip:`Curiosidade é o primeiro passo! Pergunte a um adulto de confiança e explore livros, experiências e fontes seguras sobre ${name}.`};render()}
function showAll(){document.getElementById('themes').scrollIntoView({behavior:'smooth'})}function showHistory(){const items=state.completed.slice(-5).reverse();toast(items.length?`🏅 ${items.length} conquista(s): ${items.map(x=>x.topic).join(', ')}`:'Sua primeira conquista espera por você!')}
function openProfile(){state.modal=true;render()}function modalView(){document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal-bg" onclick="if(event.target.id==='modal-bg')closeModal()"><div class="modal"><h2>Seu perfil de explorador 🌟</h2><p>Conte para a gente como chamar você e escolha seu nível escolar.</p><label>Seu nome ou apelido</label><input id="profile-name" maxlength="24" value="${esc(state.name)}"><label>Série ou nível de aprendizagem</label><select id="profile-grade">${['Pré-escola','1º ano','2º ano','3º ano','4º ano','5º ano','6º ano','7º ano','8º ano','9º ano','Ensino médio','Quero aprender por diversão'].map(x=>`<option ${state.grade===x?'selected':''}>${x}</option>`).join('')}</select><label>Idade inicial do personagem</label><input id="profile-age" type="number" min="4" max="18" value="${state.age}"><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveProfile()">Salvar ✨</button></div></div></div>`)}function closeModal(){state.modal=false;document.getElementById('modal-bg')?.remove()}function saveProfile(){state.name=document.getElementById('profile-name').value.trim()||'Aventureiro';state.grade=document.getElementById('profile-grade').value;state.age=Math.max(4,Math.min(18,Number(document.getElementById('profile-age').value)||8));state.modal=false;save();render()}function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800)}render();
</script></body></html>
